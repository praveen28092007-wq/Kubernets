<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarbonCare | Vehicle Emission Control</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <div class="brand-badge">CC</div>
      </div>
      <div class="brand-text">
        <h1>CarbonCare</h1>
        <p>Emission reduction and vehicle compliance</p>
      </div>
      <button id="logoutBtn" class="logout-btn hidden" type="button">Log out</button>
    </header>

    <main class="page">
      <section id="loginScreen" class="auth-card">
        <div class="card-header">
          <span class="eyebrow">Secure access</span>
          <h2>Login with registered mobile number</h2>
        </div>

        <form id="loginForm" class="auth-form">
          <label for="mobileNumber">Registered mobile number</label>
          <input id="mobileNumber" type="tel" inputmode="numeric" placeholder="Enter 10-digit mobile number" maxlength="10" autocomplete="tel" />

          <button type="submit" class="primary-btn">Login</button>
        </form>

        <div class="demo-note">
          Demo numbers: <strong>9876543210</strong>, <strong>8123456789</strong>, <strong>9012345678</strong>
        </div>
      </section>

      <section id="dashboardScreen" class="dashboard hidden">
        <div class="summary-grid">
          <article class="summary-card blue">
            <span class="label">Total vehicles</span>
            <strong id="totalVehicles">0</strong>
          </article>
          <article class="summary-card green">
            <span class="label">Total driving distance</span>
            <strong id="totalDistanceSummary">0 km</strong>
          </article>
          <article class="summary-card orange">
            <span class="label">Fine amount</span>
            <strong id="totalFineSummary">₹0</strong>
          </article>
          <article class="summary-card red">
            <span class="label">Alerts</span>
            <strong id="alertCount">0</strong>
          </article>
        </div>

        <div id="alertPanel" class="alert-panel"></div>

        <div id="vehicleList" class="vehicle-grid"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>

</html>
